name: Watt TF Action
description: Run Watt TF directly inside GitHub Actions
author: devsebastianops

branding:
  color: orange
  icon: zap

inputs:
  version: 
    description: 'The version of Watt TF to use (e.g. latest or v1.0.0)'
    required: false
    default: 'latest'
  input:
    description: 'The input file as JSON or YAML'
    required: true
  blueprint:
    description: 'The blueprint with the transformation rules'
    required: true
  output: 
    description: 'Where should Watt TF put the .tf.json result'
    required: true
  schema:
    description: 'Optional JSON schema file for input validation'
    required: false
  strict:
    description: 'Run Watt TF build in strict mode'
    required: false
    default: 'false'
  stripNulls: 
    description: 'Run Watt TF build with strip-nulls flag'
    required: false
    default: 'false'
  logFormat:
    description: 'Optional log format (json or text)'
    required: false
    default: 'text'
  
runs:
  using: composite
  steps:
  - name: Setup Watt TF
    shell: bash
    run: |
      if [ "${{ inputs.version }}" = "latest" ]; then
        echo "Installing latest version of Watt TF"
      else
        echo "Installing Watt TF version: ${{ inputs.version }}"
        export VERSION=${{ inputs.version }}
      fi
      curl -sSL https://raw.githubusercontent.com/devsebastianops/watt-tf/main/install.sh | bash
  - name: Run Watt TF
    shell: bash
    run: |
      # Build the command with required inputs
      CMD="wtf build --input '${{ inputs.input }}' --blueprint '${{ inputs.blueprint }}' --output '${{ inputs.output }}'"

      # Optional: schema input
      if [ -n "${{ inputs.schema }}" ]; then
        CMD="$CMD --schema '${{ inputs.schema }}'"
      fi

      # Optional: strict mode
      if [ "${{ inputs.strict }}" = "true" ]; then
        CMD="$CMD --strict"
      fi

      # Optional: strip-nulls
      if [ "${{ inputs.stripNulls }}" = "true" ]; then
        CMD="$CMD --strip-nulls"
      fi

      # Log format
      if [ -n "${{ inputs.logFormat }}" ]; then
        CMD="$CMD --log-format '${{ inputs.logFormat }}'"
      fi

      # Verbose output if runner is in debug mode or ACTIONS_RUNNER_DEBUG is set to true
      if [ "${{ runner.debug }}" = "true" ] || [ "${ACTIONS_RUNNER_DEBUG}" = "true" ]; then
        CMD="$CMD --verbose"
      fi


      echo "Executing: $CMD"
      eval $CMD